name: Test and deliver
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: true
    container:
      image: &godot-image barichello/godot-ci@sha256:6ba1eecd033b6d102860e76b7b7753d6adf2f78222b8d01cde35bfaef80b9c47
    steps:
      - name: Prepare toolchain and checkout exact source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 libfontconfig1 ca-certificates
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
      - name: Test behavior and delivery contracts
        run: |
          python3 tests/test_release.py
          python3 tests/run_checks.py
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      pages: write
    concurrency:
      group: release-and-pages
      cancel-in-progress: false
    container:
      image: *godot-image
    env:
      GODOT_EXPORT_TEMPLATES: /root/.local/share/godot/export_templates/4.7.stable
      XDG_DATA_HOME: /root/.local/share
    steps:
      - name: Prepare toolchain and checkout exact tag
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 libfontconfig1 ca-certificates gh
          gh --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --tags origin main
          git checkout --detach "$SOURCE_SHA"
      - name: Validate tag and test
        run: |
          python3 tools/build/publish_release.py --check-tag
          python3 tests/test_release.py
          python3 tests/run_checks.py
      - name: Build Windows, Linux and Web twice
        run: python3 tools/build/build_all.py --ci-direct --targets windows linux web --verify --image barichello/godot-ci@sha256:6ba1eecd033b6d102860e76b7b7753d6adf2f78222b8d01cde35bfaef80b9c47
      - name: Publish verified assets and update playable site
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/build/publish_release.py
